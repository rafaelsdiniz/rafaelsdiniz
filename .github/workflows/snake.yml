name: GitHub Snake

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: rafaelsdiniz
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit and push generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: Update GitHub Snake SVG
          branch: main
          file_pattern: dist/**
